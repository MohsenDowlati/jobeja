version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/storage/migrations/*.up.sql"
    queries: "internal/storage/queries"
    gen:
      go:
        package: "postgres"
        out: "internal/storage/postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
